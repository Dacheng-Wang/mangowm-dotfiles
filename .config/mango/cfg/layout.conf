# | Layout |
# layouts | https://mangowm.github.io/docs/window-management/layouts

# Main Monitor (HDMI-A-1) -> Horizontal Scroller
tagrule = id:1, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:2, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:3, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:4, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:5, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:6, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:7, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:8, monitor_name:HDMI-A-1, layout_name:scroller
tagrule = id:9, monitor_name:HDMI-A-1, layout_name:scroller

# Side Monitor (HDMI-A-2) -> Vertical Scroller
tagrule = id:1, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:2, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:3, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:4, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:5, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:6, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:7, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:8, monitor_name:HDMI-A-2, layout_name:vertical_scroller
tagrule = id:9, monitor_name:HDMI-A-2, layout_name:vertical_scroller

# | Scroller Configuration |
scroller_structs = 8
scroller_default_proportion = 0.5
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 1
scroller_ignore_proportion_single = 0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.33333, 0.5, 0.66667, 1.0

# Master-Stack layout settings (fallback)
new_is_master = 1
default_mfact = 0.55
default_nmaster = 1
smartgaps = 0
