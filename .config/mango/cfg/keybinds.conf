# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

# Your favorite applications & scratchpads
bind = ALT, t, spawn, ghostty
bind = ALT, e, spawn, dolphin
bind = ALT, f, spawn, firefox
bind = ALT, b, spawn, google-chrome-stable
bind = ALT, z, toggle_named_scratchpad, dev.zed.Zed, none, zeditor
bind = ALT, s, toggle_named_scratchpad, Spotify, none, spotify
bind = ALT+SHIFT, s, toggle_named_scratchpad, spotube, none, spotube

bind = SUPER, q, killclient,

# Noctalia specific keybinds.
bind = SUPER, space, spawn, noctalia msg panel-toggle launcher
bind = SUPER, x, spawn, noctalia msg panel-toggle control-center
bind = SUPER, z, spawn, noctalia msg settings-toggle
bind = SUPER+SHIFT, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser
bind = SUPER, c, spawn, noctalia msg panel-toggle clipboard
bind = SUPER+SHIFT, q, spawn, noctalia msg panel-toggle session
bind = CTRL+SUPER, q, spawn, noctalia msg session lock

# Screenshots
bind = SUPER, p, spawn, noctalia msg screenshot-region
bind = SUPER+SHIFT, p, spawn, noctalia msg screenshot-fullscreen
bind = SUPER+ALT, p, spawn, noctalia msg screenshot-fullscreen all

# Reload config
bind = SUPER, r, reload_config

# Audio controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute
bind = NONE, XF86AudioPlay, spawn, noctalia msg media toggle
bind = NONE, XF86AudioNext, spawn, noctalia msg media next
bind = NONE, XF86AudioPrev, spawn, noctalia msg media previous
bind = NONE, XF86AudioStop, spawn, noctalia msg media stop
bind = SUPER, XF86AudioNext, spawn, noctalia msg media next-player
bind = SUPER, XF86AudioPrev, spawn, noctalia msg media previous-player

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# Switch window focus
bind = ALT+SHIFT, Tab, focusstack, next
bind = ALT, h, focusdir, left
bind = ALT, l, focusdir, right
bind = ALT, k, focusdir, up
bind = ALT, j, focusdir, down
# Swap window
bind = ALT+SHIFT, h, exchange_client, left
bind = ALT+SHIFT, l, exchange_client, right
bind = ALT+SHIFT, k, exchange_client, up
bind = ALT+SHIFT, j, exchange_client, down
# Switch window status
bind = SUPER, g, toggleglobal,
bind = SUPER, Tab, toggleoverview,
bind = ALT, Space, togglefloating,
bind = ALT, Return, togglemaximizescreen,
bind = SUPER, Return, togglefullscreen,
bind = SUPER+ALT, Return, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, i, restore_minimized
bind = ALT, c, toggle_named_scratchpad, (?i)speedcrunch, none, speedcrunch

# Scroller layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, e, switch_proportion_preset,

# Switch layout
bind = SUPER, n, switch_layout

# Switch between workspaces
bind = ALT, Tab, view, -1
bind = ALT, 1, viewcrossmon, 1, HDMI-A-1
bind = ALT, 2, viewcrossmon, 2, HDMI-A-2
bind = ALT, 3, view, 3, 0
bind = ALT, 4, view, 4, 0
bind = ALT, 5, view, 5, 0
bind = ALT, 6, view, 6, 0
bind = ALT, 7, view, 7, 0
bind = ALT, 8, view, 8, 0
bind = ALT, 9, view, 9, 0

# Tag: move client to workspace
bind = ALT+SHIFT, 1, tagcrossmon, 1, HDMI-A-1
bind = ALT+SHIFT, 2, tagcrossmon, 2, HDMI-A-2
bind = ALT+SHIFT, 3, tag, 3, 0
bind = ALT+SHIFT, 4, tag, 4, 0
bind = ALT+SHIFT, 5, tag, 5, 0
bind = ALT+SHIFT, 6, tag, 6, 0
bind = ALT+SHIFT, 7, tag, 7, 0
bind = ALT+SHIFT, 8, tag, 8, 0
bind = ALT+SHIFT, 9, tag, 9, 0

# Switch between monitors
bind = ALT, u, focusmon, left
bind = ALT, o, focusmon, right
# Move window to another monitor
bind = SHIFT+ALT, u, tagmon, left
bind = SHIFT+ALT, o, tagmon, right

# Gaps
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1
bind = SUPER+SHIFT, R, togglegaps

# Movewin
bind = CTRL+SHIFT, Up, movewin, +0, -50
bind = CTRL+SHIFT, Down, movewin, +0, +50
bind = CTRL+SHIFT, Left, movewin, -50,+0
bind = CTRL+SHIFT, Right, movewin, +50,+0

# Resizewin
bind = CTRL+ALT, Up, resizewin, +0, -50
bind = CTRL+ALT, Down, resizewin, +0, +50
bind = CTRL+ALT, Left, resizewin, -50, +0
bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = SUPER, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize
