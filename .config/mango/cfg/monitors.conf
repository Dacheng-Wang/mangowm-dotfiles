# | Outputs Configuration |
# Configure your monitors here or in the DMS "Displays" settings. | https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitors information.
# You will have to remove "#" and edit it for it to take effect.
# HDMI-A-2: Dell Vertical Display (Leftmost display at origin)
monitorrule = name:HDMI-A-2, width:2560, height:1440, refresh:60.0, x:0, y:0, scale:1.0, rr:1

# HDMI-A-1: Samsung Odyssey 4K (Primary Display placed to the right)
monitorrule = name:HDMI-A-1, width:3840, height:2160, refresh:60.0, x:1440, y:425, scale:1.5, rr:0
